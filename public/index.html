<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Recipes</title>
  </head>
  <body>
    <h1>Recipes</h1>
    <hr />
    <p id="message"></p>
    <hr />
    <!-- Register and/or logon -->
    <div id="logon-register" style="display: none">
      <button type="button" id="logon">logon</button>
      <button type="button" id="register">register</button>
    </div>
    <div id="logon-div" style="display: none">
      <form>
        <div>
          <label for="email">email:</label>
          <input type="email" id="email" />
        </div>
        <div>
          <label for="password">password:</label>
          <input type="password" id="password" />
        </div>
        <button type="button" id="logon-button">logon</button>
        <button type="button" id="logon-cancel">cancel</button>
      </form>
    </div>
    <div id="register-div" style="display: none">
      <form>
        <div>
          <label for="name">name:</label>
          <input type="text" id="name" />
        </div>
        <div>
          <label for="email1">email:</label>
          <input type="email" id="email1" />
        </div>
        <div>
          <label for="password1">password:</label>
          <input type="password" id="password1" />
        </div>
        <div>
          <label for="password2">verify password:</label>
          <input type="password" id="password2" />
        </div>
        <button type="button" id="register-button">register</button>
        <button type="button" id="register-cancel">cancel</button>
      </form>
    </div>
    <!-- Table of recipes -- make it into a card later?-->
    <div id="recipes" style="display: none">
      <p id="recipe-message"></p>
      <table id="recipes-table">
        <tr id="recipes-table-header">
          <th>Title</th>
          <th>Ingredients</th>
          <th>Difficulty</th>
          <th colspan="2"></th>
        </tr>
      </table>
      <button type="button" id="add-recipe">add recipe</button>
      <button type="button" id="logoff">log off</button>
    </div>
    <!-- Edit recipe div -->
    <div id="edit-recipe" style="display: none">
      <form>
        <div>
          <label for="title">Title:</label>
          <input type="text" id="title" />
        </div>
        <div>
          <label for="ingredients">Ingredients:</label>
          <input type="text" id="ingredients" />
        </div>
        <div>
          <label for="difficulty">Difficulty:</label>
          <select id="difficulty">
            <option value="easy">easy</option>
            <option value="medium"><map name=""></map>medium</option>
            <option value="hard">hard</option>
          </select>
        </div>
        <button type="button" id="adding-recipe">add</button>
        <button type="button" id="edit-cancel">cancel</button>
      </form>
    </div>
    <script src="./index.js" type="module"></script>
  </body>
</html>
